<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#EFD9BE"/>

  <!-- table -->
  <rect x="0" y="560" width="1200" height="190" fill="#8C5A2B"/>
  <rect x="0" y="560" width="1200" height="14" fill="#5C2414"/>

  <!-- grinder body -->
  <g transform="translate(430,300)">
    <rect x="0" y="120" width="220" height="180" rx="18" fill="#362A22"/>
    <rect x="20" y="40" width="180" height="90" rx="14" fill="#B5482A"/>
    <rect x="70" y="0" width="80" height="50" rx="10" fill="#5C2414"/>
    <circle cx="110" cy="8" r="10" fill="#C98A3B"/>
    <rect x="95" y="290" width="30" height="46" fill="#C98A3B"/>
    <rect x="60" y="330" width="100" height="18" rx="8" fill="#5C2414"/>
  </g>

  <!-- ground coffee pile -->
  <ellipse cx="540" cy="612" rx="120" ry="26" fill="#3A2418"/>
  <ellipse cx="540" cy="606" rx="100" ry="20" fill="#4A2C1D"/>

  <!-- steam swirls from a cup -->
  <g transform="translate(860,330)">
    <path d="M0 220c50 0 90 40 90 90v20H-90v-20c0-50 40-90 90-90z" fill="#F1E7D8" stroke="#362A22" stroke-width="6"/>
    <rect x="-95" y="220" width="190" height="26" fill="#362A22"/>
    <path d="M90 250c30 0 46 18 46 40s-16 34-40 30" fill="none" stroke="#362A22" stroke-width="10" stroke-linecap="round"/>
    <path d="M-30 170c-16-20-16-40 0-60" fill="none" stroke="#C98A3B" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <path d="M10 150c-16-24-16-48 4-72" fill="none" stroke="#C98A3B" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <path d="M45 170c-12-18-10-36 4-54" fill="none" stroke="#C98A3B" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- scattered beans -->
  <g fill="#3A2418">
    <ellipse cx="200" cy="640" rx="14" ry="8" transform="rotate(15 200 640)"/>
    <ellipse cx="240" cy="660" rx="14" ry="8" transform="rotate(-20 240 660)"/>
    <ellipse cx="170" cy="670" rx="14" ry="8" transform="rotate(50 170 670)"/>
    <ellipse cx="1000" cy="650" rx="14" ry="8" transform="rotate(10 1000 650)"/>
    <ellipse cx="1040" cy="670" rx="14" ry="8" transform="rotate(-30 1040 670)"/>
  </g>
  <g stroke="#EFD9BE" stroke-width="2" fill="none">
    <path d="M194 636 q6 4 12 0"/>
    <path d="M234 656 q6 4 12 0"/>
  </g>

  <!-- small jar to the side -->
  <g transform="translate(120,420)">
    <rect x="0" y="40" width="110" height="140" rx="12" fill="#F1E7D8" stroke="#362A22" stroke-width="5"/>
    <rect x="0" y="40" width="110" height="36" fill="#6E3B1E"/>
    <rect x="0" y="76" width="110" height="30" fill="#F1E7D8"/>
    <rect x="0" y="106" width="110" height="74" fill="#3A2418"/>
    <rect x="-8" y="24" width="126" height="20" rx="8" fill="#362A22"/>
  </g>
</svg>
