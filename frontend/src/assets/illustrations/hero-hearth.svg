<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#F1E7D8"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <defs>
    <radialGradient id="glow" cx="70%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#F3DCC9"/>
      <stop offset="60%" stop-color="#F1E7D8"/>
      <stop offset="100%" stop-color="#E7D6BC"/>
    </radialGradient>
  </defs>

  <!-- back wall -->
  <rect x="0" y="0" width="1200" height="520" fill="#EADBC4"/>

  <!-- hearth arch -->
  <path d="M760 520 V300 a180 180 0 0 1 360 0 V520 Z" fill="#5C2414"/>
  <path d="M800 520 V300 a140 140 0 0 1 280 0 V520 Z" fill="#2A1712"/>
  <!-- flames -->
  <g>
    <path d="M900 470c-30-10-48-34-48-62 0-24 14-40 24-56 5 13 13 22 22 25-3-22 6-42 24-58 0 24 10 40 26 50 14 8 24 22 24 40 0 36-28 61-72 61z" fill="#B5482A"/>
    <path d="M905 470c-18-6-29-21-29-38 0-14 8-24 15-34 3 8 8 13 13 15-2-13 3-25 14-35 0 15 6 24 16 30 8 5 14 13 14 24 0 22-17 38-43 38z" fill="#C98A3B"/>
    <path d="M912 452c-8-3-13-10-13-18 0-6 4-11 7-16 1 4 4 6 6 7-1-6 1-12 6-16 0 7 3 11 7 14 4 2 6 6 6 11 0 10-8 18-19 18z" fill="#EFD9BE"/>
  </g>

  <!-- wooden shelf -->
  <rect x="60" y="470" width="1080" height="26" fill="#5C2414"/>
  <rect x="60" y="496" width="1080" height="10" fill="#3a1710"/>

  <!-- jars on shelf -->
  <g>
    <!-- jar 1 -->
    <g transform="translate(140,360)">
      <rect x="0" y="60" width="90" height="110" rx="10" fill="#F1E7D8" stroke="#362A22" stroke-width="4"/>
      <rect x="0" y="60" width="90" height="34" fill="#8C5A2B"/>
      <rect x="0" y="94" width="90" height="30" fill="#F1E7D8"/>
      <rect x="0" y="124" width="90" height="46" fill="#3A2418"/>
      <rect x="-6" y="46" width="102" height="18" rx="6" fill="#362A22"/>
      <circle cx="45" cy="150" r="5" fill="#C98A3B"/>
    </g>
    <!-- jar 2 -->
    <g transform="translate(300,340)">
      <rect x="0" y="70" width="100" height="130" rx="10" fill="#F1E7D8" stroke="#362A22" stroke-width="4"/>
      <rect x="0" y="70" width="100" height="28" fill="#6E3B1E"/>
      <rect x="0" y="98" width="100" height="26" fill="#F1E7D8"/>
      <rect x="0" y="124" width="100" height="26" fill="#8C5A2B"/>
      <rect x="0" y="150" width="100" height="50" fill="#3A2418"/>
      <rect x="-6" y="56" width="112" height="18" rx="6" fill="#362A22"/>
    </g>
    <!-- jar 3 -->
    <g transform="translate(470,370)">
      <rect x="0" y="50" width="86" height="100" rx="10" fill="#F1E7D8" stroke="#362A22" stroke-width="4"/>
      <rect x="0" y="50" width="86" height="30" fill="#B5482A"/>
      <rect x="0" y="80" width="86" height="70" fill="#8C5A2B"/>
      <rect x="-6" y="36" width="98" height="18" rx="6" fill="#362A22"/>
    </g>
  </g>

  <!-- coffee beans scattered -->
  <g fill="#3A2418">
    <ellipse cx="620" cy="500" rx="10" ry="6" transform="rotate(20 620 500)"/>
    <ellipse cx="645" cy="510" rx="10" ry="6" transform="rotate(-15 645 510)"/>
    <ellipse cx="600" cy="515" rx="10" ry="6" transform="rotate(40 600 515)"/>
  </g>

  <!-- floor -->
  <rect x="0" y="520" width="1200" height="230" fill="#E7D6BC"/>

  <!-- large hero jar in foreground -->
  <g transform="translate(920,470)">
    <rect x="-20" y="-260" width="240" height="300" rx="24" fill="#F1E7D8" stroke="#362A22" stroke-width="6"/>
    <rect x="-20" y="-260" width="240" height="70" fill="#6E3B1E"/>
    <rect x="-20" y="-190" width="240" height="60" fill="#F1E7D8"/>
    <rect x="-20" y="-130" width="240" height="60" fill="#8C5A2B"/>
    <rect x="-20" y="-70" width="240" height="110" fill="#3A2418"/>
    <rect x="-34" y="-290" width="268" height="34" rx="10" fill="#362A22"/>
    <circle cx="60" cy="10" r="8" fill="#C98A3B"/>
    <circle cx="120" cy="-40" r="6" fill="#B5482A"/>
  </g>
</svg>
